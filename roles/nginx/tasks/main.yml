---
# Variable setup.
- name: Include OS-specific variables.
  include_vars: "{{ ansible_facts.os_family }}.yml"

- name: Define nginx_user.
  set_fact:
    nginx_user: "{{ __nginx_user }}"
  when: nginx_user is not defined

# Setup/install tasks.
- include_tasks: setup-RedHat.yml
  when: ansible_facts.os_family == 'RedHat' or ansible_facts.os_family == 'Rocky' or ansible_facts.os_family == 'AlmaLinux'

- include_tasks: setup-Ubuntu.yml
  when: ansible_facts.distribution == 'Ubuntu'

- include_tasks: setup-Debian.yml
  when: ansible_facts.os_family == 'Debian'

- include_tasks: setup-FreeBSD.yml
  when: ansible_facts.os_family == 'FreeBSD'

- include_tasks: setup-OpenBSD.yml
  when: ansible_facts.os_family == 'OpenBSD'

- include_tasks: setup-Archlinux.yml
  when: ansible_facts.os_family == 'Archlinux'

- include_tasks: setup-Suse.yml
  when: ansible_facts.os_family == 'Suse'

# Vhost configuration.
- import_tasks: vhosts.yml

# Nginx setup.
- name: Copy nginx configuration in place.
  template:
    src: "{{ nginx_conf_template }}"
    dest: "{{ nginx_conf_file_path }}"
    owner: root
    group: "{{ root_group }}"
    mode: 0644
    validate: nginx -t -c %s
  notify:
    - reload nginx

- name: Ensure nginx service is running as configured.
  service:
    name: nginx
    state: "{{ nginx_service_state }}"
    enabled: "{{ nginx_service_enabled }}"
# =============================================================================
# LOAD BALANCER CONFIGURATION
# =============================================================================

- name: Configure Nginx as Load Balancer
  block:
    - name: Stop Nginx service
      service:
        name: nginx
        state: stopped

    - name: Remove default site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Create load balancer configuration
      template:
        src: loadbalancer.conf.j2
        dest: /etc/nginx/sites-available/loadbalancer.conf

    - name: Enable load balancer site
      file:
        src: /etc/nginx/sites-available/loadbalancer.conf
        dest: /etc/nginx/sites-enabled/loadbalancer.conf
        state: link

    - name: Test Nginx configuration
      command: nginx -t

    - name: Start Nginx service
      service:
        name: nginx
        state: started

  when:
    - enable_nginx_lb | default(false) | bool
    - load_balancer_is_required | default(false) | bool
    - inventory_hostname in groups['lb']