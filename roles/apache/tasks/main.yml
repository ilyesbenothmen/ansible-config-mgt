---
# Include variables and define needed variables.
- name: Include OS-specific variables.
  include_vars: "{{ ansible_facts.os_family }}.yml"

- name: Include variables for Amazon Linux.
  include_vars: "AmazonLinux.yml"
  when:
    - ansible_facts.distribution == "Amazon"
    - ansible_facts.distribution_major_version == "NA"

- name: Define apache_packages.
  set_fact:
    apache_packages: "{{ __apache_packages | list }}"
  when: apache_packages is not defined

# Setup/install tasks.
- include_tasks: "setup-{{ ansible_facts.os_family }}.yml"

# Figure out what version of Apache is installed.
- name: Get installed version of Apache.
  command: "{{ apache_daemon_path }}{{ apache_daemon }} -v"
  changed_when: false
  check_mode: false
  register: _apache_version

- name: Create apache_version variable.
  set_fact:
    apache_version: "{{ _apache_version.stdout.split()[2].split('/')[1] }}"

- name: Include Apache 2.2 variables.
  include_vars: apache-22.yml
  when: "apache_version.split('.')[1] == '2'"

- name: Include Apache 2.4 variables.
  include_vars: apache-24.yml
  when: "apache_version.split('.')[1] == '4'"

# Configure Apache.
- name: Configure Apache.
  include_tasks: "configure-{{ ansible_facts.os_family }}.yml"

- name: Ensure Apache has selected state and enabled on boot.
  service:
    name: "{{ apache_service }}"
    state: "{{ apache_state }}"
    enabled: "{{ apache_enabled }}"

- name: Configure Apache as Load Balancer
  block:
    - name: Stop Apache service
      service:
        name: apache2
        state: stopped
      when: ansible_os_family == "Debian"

    - name: Disable default site (000-default.conf)
      command: a2dissite 000-default.conf
      ignore_errors: true
      when: ansible_os_family == "Debian"

    - name: Disable vhosts site
      command: a2dissite vhosts.conf
      ignore_errors: true
      when: ansible_os_family == "Debian"
    - name: Enable required proxy modules (Debian/Ubuntu)
      command: "a2enmod {{ item }}"
      loop:
        - proxy
        - proxy_http
        - proxy_balancer
        - lbmethod_byrequests
        - headers
      notify: restart apache
      args:
        creates: "/etc/apache2/mods-enabled/{{ item }}.load"
      when: ansible_os_family == "Debian"

    - name: Enable required proxy modules (RHEL/CentOS/Amazon)
      copy:
        dest: "/etc/httpd/conf.d/proxy.conf"
        content: |
          LoadModule proxy_module modules/mod_proxy.so
          LoadModule proxy_http_module modules/mod_proxy_http.so
          LoadModule proxy_balancer_module modules/mod_proxy_balancer.so
          LoadModule lbmethod_byrequests_module modules/mod_lbmethod_byrequests.so
      notify: restart apache
      when: ansible_os_family == "RedHat"

    - name: Create load balancer configuration (Debian/Ubuntu)
      template:
        src: loadbalancer.conf.j2
        dest: /etc/apache2/sites-available/loadbalancer.conf
      notify: restart apache
      when: ansible_os_family == "Debian"

    - name: Create load balancer configuration (RHEL/CentOS/Amazon)
      template:
        src: loadbalancer.conf.j2
        dest: /etc/httpd/conf.d/loadbalancer.conf
      notify: restart apache
      when: ansible_os_family == "RedHat"

    - name: Enable load balancer site (Debian/Ubuntu)
      command: a2ensite loadbalancer.conf
      args:
        creates: /etc/apache2/sites-enabled/loadbalancer.conf
      notify: restart apache
      when: ansible_os_family == "Debian"

  when: 
    - enable_apache_lb | default(false) | bool
    - load_balancer_is_required | default(false) | bool
    - inventory_hostname in groups['lb']