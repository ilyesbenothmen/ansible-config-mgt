#    accept_hostkey: false  
#    force: yes
- name: Select tooling checkout user
  ansible.builtin.set_fact:
    tooling_user: >-
      {{ 'ubuntu' if ansible_facts['distribution'] == 'Ubuntu'
         else 'ec2-user' }}

- name: Clone tooling outside the web root
  become: true
  become_user: "{{ tooling_user }}"
  ansible.builtin.git:
    repo: https://github.com/ilyesbenothmen/tooling.git
    dest: "/home/{{ tooling_user }}/tooling"
    version: HEAD

- name: Publish tooling website files
  become: true
  ansible.builtin.copy:
    src: "/home/{{ tooling_user }}/tooling/html/"
    dest: /var/www/html
    remote_src: true
    mode: preserve

- name: Start service httpd, if not started
  remote_user: ec2-user
  become: true
  become_user: root
  ansible.builtin.service:
    name: httpd
    state: started

- name: recursively remove /var/www/html/html/ directory
  remote_user: ec2-user
  become: true
  become_user: root
  ansible.builtin.file:
    path: /var/www/html/html
    state: absent
