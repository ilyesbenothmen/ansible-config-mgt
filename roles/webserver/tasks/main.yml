---
- name: install apache
  remote_user: ec2-user
  become: true
  become_user: root
  ansible.builtin.yum:
    name: "httpd"
    state: present

- name: install git
  remote_user: ec2-user
  become: true
  become_user: root
  ansible.builtin.yum:
    name: "git"
    state: present

- name: Ensure web root exists and is writable by ec2-user
  become: true
  ansible.builtin.file:
    path: /var/www/html
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: "0775"

#- name: clone a repo
#  become_user: ec2-user
