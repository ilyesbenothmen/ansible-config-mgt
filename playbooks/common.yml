---
- name: update web, nfs 
  hosts: webservers, nfs
  remote_user: ec2-user
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3.9
  become_user: root
  tasks:
    - name: ensure wireshark is at the latest version
      ansible.builtin.command: dnf install -y wireshark
      register: dnf_output
      changed_when: "'Nothing to do' not in dnf_output.stdout"

- name: update LB server
  hosts: lb ,db
  remote_user: ubuntu
  become: yes
  become_user: root
  tasks:
    - name: Update apt repo
      apt: 
        update_cache: yes

    - name: ensure wireshark is at the latest version
      apt:
        name: wireshark
        state: latest

- name: Create /tmp/test directory and empty file
  hosts: all
  become: true

  tasks:
    - name: Ensure /tmp/test directory exists
      ansible.builtin.file:
        path: /tmp/test
        state: directory
        mode: '0755'

    - name: Ensure /tmp/test/test file exists (empty)
      ansible.builtin.file:
        path: /tmp/test4
        state: touch
        mode: '0644'
