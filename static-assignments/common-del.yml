---
- name: update web, nfs and db servers
  hosts: webservers, nfs, db
  remote_user: ec2-user
  become: yes
  become_user: root
  vars:
    ansible_python_interpreter: /usr/bin/python3.9
  tasks:
    - name: delete wireshark
      ansible.builtin.dnf:
        name: wireshark
        state: absent
      register: dnf_output

- name: update LB server
  hosts: lb
  remote_user: ubuntu
  become: yes
  become_user: root
  tasks:
    - name: delete wireshark
      apt:
        name: wireshark
        state: absent
        autoremove: yes
        purge: yes
        autoclean: yes
